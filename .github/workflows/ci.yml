name: Assessment 3 verification and evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: phoneme_builder_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d phoneme_builder_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phoneme_builder_test?schema=public
      ALLOW_TEST_TRAFFIC: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_LABEL: PostgreSQL 17 service container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare database and simulated records
        run: npm run db:deploy && npm run db:seed && npm run db:simulate
      - name: Static checks, unit tests and production build
        run: |
          mkdir -p evidence
          npm run check 2>&1 | tee evidence/quality-checks.txt
      - name: Start production application
        run: |
          npm start -- --hostname 127.0.0.1 > evidence/server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > evidence/health.json; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/health
      - name: API and Playwright end-to-end tests
        run: |
          npm run test:api 2>&1 | tee evidence/api-smoke.txt
          npm run test:e2e
      - name: Lighthouse accessibility checks
        run: npm run test:accessibility
      - name: Capture application screenshots
        run: node scripts/capture-evidence.mjs
      - name: Install Apache JMeter
        run: |
          curl --fail --location https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o /tmp/jmeter.tgz
          curl --fail --location https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz.sha512 -o /tmp/jmeter.sha512
          python - <<'PY'
          import hashlib, re
          expected = re.search(r'[a-fA-F0-9]{128}', open('/tmp/jmeter.sha512').read()).group().lower()
          assert hashlib.sha512(open('/tmp/jmeter.tgz','rb').read()).hexdigest() == expected
          PY
          tar -xzf /tmp/jmeter.tgz -C /tmp
      - name: JMeter staged load evidence
        env:
          JMETER_BIN: /tmp/apache-jmeter-5.6.3/bin/jmeter
        run: npm run test:load
      - name: Verify persistence from a fresh application process
        run: node scripts/persistence-check.mjs
      - name: Build Docker production image
        run: docker build --target runner --tag phoneme-activity-builder:assessment3 .
      - name: Record evidence environment
        if: always()
        run: |
          node -e 'console.log(JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,node:process.version,date:new Date().toISOString(),platform:process.platform},null,2))' > evidence/environment.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment3-evidence
          path: |
            evidence/
            test-results/
          retention-days: 30
