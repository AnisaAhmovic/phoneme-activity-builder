name: Assessment 2 quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: phoneme_builder_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phoneme_builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phoneme_builder_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npm run db:deploy && npm run db:seed

      - name: Run static and unit checks
        run: npm run lint && npm run typecheck && npm run test

      - name: Build production application
        run: npm run build

      - name: Run API smoke test
        run: |
          npm start &
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:api

      - name: Build Docker image
        run: docker build --target runner --tag phoneme-activity-builder:test .
